<svg xmlns="http://www.w3.org/2000/svg" width="600" height="660" viewBox="0 0 600 660">
  <title>Meroë pyramids beside the Nile, doum palms, a Sudanese textile and a jebena coffee pot</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d6a2"/>
      <stop offset="1" stop-color="#e9a874"/>
    </linearGradient>
    <linearGradient id="nile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f9e8f"/>
      <stop offset="1" stop-color="#3f6f63"/>
    </linearGradient>
    <pattern id="courses" width="8" height="11" patternUnits="userSpaceOnUse">
      <path d="M0 10.5h8" stroke="#4c2227" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <pattern id="grain" width="7" height="9" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="2" r=".7" fill="#753b2f" opacity=".12"/>
    </pattern>
    <pattern id="weave" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M15 3 27 15 15 27 3 15Z" fill="none" stroke="#f1dfb8" stroke-width="2"/>
      <path d="M15 10 20 15 15 20 10 15Z" fill="#d68a5c"/>
      <path d="M0 0h4L0 4ZM30 0h-4l4 4ZM0 30h4l-4-4ZM30 30h-4l4-4Z" fill="#f1dfb8"/>
    </pattern>
    <clipPath id="arch"><path d="M40 640V280a260 260 0 0 1 520 0v360Z"/></clipPath>
  </defs>

  <g clip-path="url(#arch)">
    <rect width="600" height="660" fill="url(#sky)"/>
    <circle cx="398" cy="178" r="98" fill="#f8e2ae" opacity=".35"/>
    <circle cx="398" cy="178" r="68" fill="#f8e2ae"/>
    <g fill="none" stroke="#7a3f33" stroke-width="2.4" stroke-linecap="round" opacity=".55">
      <path d="M150 150q8-7 15 0q7-7 15 0"/>
      <path d="M196 120q6-5 11 0q5-5 11 0"/>
    </g>

    <!-- distant dunes -->
    <path d="M0 368q150-46 300-12t300-16v300H0Z" fill="#e3aa77"/>

    <!-- Meroë pyramids: steep sides, small chapels at their base -->
    <g>
      <path d="M86 432 128 262l42 170Z" fill="#c27a51"/>
      <path d="M128 262l42 170h-42Z" fill="#9a573d"/>
      <path d="M318 432 354 296l36 136Z" fill="#c78057"/>
      <path d="M354 296l36 136h-36Z" fill="#a15d41"/>
      <path d="M150 432 209 196l59 236Z" fill="#cf8a5c"/>
      <path d="M209 196l59 236h-59Z" fill="#a35f42"/>
      <path d="M250 432 289 270l39 162Z" fill="#c98256"/>
      <path d="M289 270l39 162h-39Z" fill="#9e5a3f"/>
      <path d="M86 432 128 262l42 170ZM150 432 209 196l59 236ZM250 432 289 270l39 162ZM318 432 354 296l36 136Z" fill="url(#courses)"/>
      <!-- chapels -->
      <path d="M184 432l3-30h44l3 30Z" fill="#b8704c"/>
      <path d="M201 432v-17a8 8 0 0 1 16 0v17Z" fill="#6e3a2e"/>
      <path d="M272 432l2-20h30l2 20Z" fill="#b06a48"/>
      <path d="M284 432v-10a5 5 0 0 1 10 0v10Z" fill="#6e3a2e"/>
    </g>

    <!-- near dunes -->
    <path d="M0 440q140-34 290-6t310-12v220H0Z" fill="#ebbb85"/>

    <!-- doum palms: the forked trunk is what sets them apart -->
    <g stroke="#6e3a2e" stroke-linecap="round" fill="none">
      <path d="M478 472c-2-34 0-56-4-80m0 0c-10-18-22-30-34-40m34 40c6-20 16-34 30-44" stroke-width="7"/>
      <path d="M548 470c0-22 1-36-2-52m0 0c-6-12-14-20-22-26m22 26c4-12 10-20 19-27" stroke-width="5"/>
    </g>
    <g fill="#365c49">
    <g transform="translate(440 352) scale(1)"><path transform="rotate(-200)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-175)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-150)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-125)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-100)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-75)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-50)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-25)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(0)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(20)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/></g>
    <g transform="translate(504 304) scale(1.05)"><path transform="rotate(-200)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-175)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-150)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-125)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-100)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-75)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-50)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-25)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(0)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(20)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/></g>
    <g transform="translate(524 392) scale(0.72)"><path transform="rotate(-200)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-175)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-150)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-125)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-100)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-75)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-50)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-25)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(0)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(20)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/></g>
    <g transform="translate(565 391) scale(0.72)"><path transform="rotate(-200)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-175)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-150)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-125)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-100)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-75)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-50)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(-25)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(0)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/><path transform="rotate(20)" d="M0 0c10-6 26-8 44-2-16 2-30 6-44 6z"/></g>
  </g>

    <!-- the Nile -->
    <path d="M0 486q150-26 300-2t300-10v72q-150 18-300-4T0 552Z" fill="url(#nile)"/>
    <g fill="none" stroke="#cfe3d8" stroke-width="2.4" stroke-linecap="round" opacity=".8">
      <path d="M64 512q14-6 28 0t28 0"/>
      <path d="M220 530q12-5 24 0t24 0"/>
      <path d="M420 506q14-6 28 0t28 0"/>
      <path d="M486 532q10-4 20 0"/>
    </g>
    <!-- felucca -->
    <g transform="translate(330 470)">
      <path d="M0 26h56l-8 10H8Z" fill="#6e3a2e"/>
      <path d="M26 26V-28" stroke="#6e3a2e" stroke-width="2.5"/>
      <path d="M27-26 54 20H27Z" fill="#fbf1de"/>
      <path d="M25-18 6 20h19Z" fill="#f1dfc0"/>
    </g>

    <!-- near bank -->
    <path d="M0 548q160-26 300 4t300-14v122H0Z" fill="#d48b60"/>
    <path d="M0 604q140-30 296-4t304-8v68H0Z" fill="#b9714f"/>
    <rect width="600" height="660" fill="url(#grain)"/>
  </g>

  <!-- textile card -->
  <g transform="translate(6 420) rotate(-8 80 100)">
    <rect width="156" height="200" rx="4" fill="#37614c"/>
    <rect x="9" y="9" width="138" height="182" fill="url(#weave)"/>
    <rect x="9" y="9" width="138" height="182" fill="none" stroke="#f1dfb8" stroke-width="2"/>
  </g>

  <!-- jebena card -->
  <g transform="translate(380 480) rotate(7 105 80)">
    <rect width="212" height="170" fill="#fff8e8"/>
    <rect x="12" y="12" width="188" height="128" fill="#612c32"/>
    <ellipse cx="74" cy="128" rx="34" ry="5" fill="#4c2227"/>
    <path d="M70 56c-18 0-25 18-20 34" fill="none" stroke="#c98a5e" stroke-width="5" stroke-linecap="round"/>
    <path d="M92 104c12-8 20-24 24-44" fill="none" stroke="#c98a5e" stroke-width="6" stroke-linecap="round"/>
    <circle cx="74" cy="102" r="26" fill="#c98a5e"/>
    <path d="M65 80l3-36h12l3 36Z" fill="#c98a5e"/>
    <rect x="63" y="39" width="22" height="6" rx="3" fill="#e6c9a7"/>
    <path d="M51 96q23 10 46 0" fill="none" stroke="#e6c9a7" stroke-width="2.5"/>
    <path d="M53 106q21 9 42 0" fill="none" stroke="#e6c9a7" stroke-width="1.5" stroke-dasharray="3 4"/>
    <g fill="#fff8e8">
      <path d="M132 108h20l-3 15h-14Z"/><path d="M158 108h20l-3 15h-14Z"/>
    </g>
    <path d="M126 126h58" stroke="#e6c9a7" stroke-width="3" stroke-linecap="round"/>
    <g fill="none" stroke="#e6c9a7" stroke-width="2" stroke-linecap="round" opacity=".8">
      <path d="M70 32c-5-6 1-10-1-16M80 32c-5-6 1-10-1-16"/>
    </g>
    <text x="106" y="159" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#612c32">a cup of home</text>
  </g>
</svg>
